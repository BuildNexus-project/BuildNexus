# Assessment baseline: 20 concurrent users, not observed production traffic.
# Read-heavy mix: 10 Clients, 5 project creators, 3 Architects and 2 Admins.
# Finite loops and per-request think time model a bounded workload; they do
# not guarantee a fixed request rate or a constant concurrency plateau.
# The runner loads this file before applying explicit -Jproperty=value overrides.
profile=load
stress_multipliers=1,2,4,8

project_threads=5
project_loops=20
project_rampup=10
project_think_ms=250
design_threads=3
design_loops=10
design_rampup=10
design_think_ms=500
journey_threads=10
journey_loops=10
journey_rampup=10
journey_think_ms=250
report_threads=2
report_loops=20
report_rampup=10
report_think_ms=500

max_error_rate_pct=1
p95_project_create_ms=1500
p95_design_upload_ms=3000
p95_login_ms=2000
p95_project_list_ms=1000
p95_project_detail_ms=1000
p95_invoices_ms=1000
p95_history_ms=1000
p95_dashboard_ms=1000
p95_progress_ms=1000
p95_reports_ms=2000
fixture_timeout=60
connect_timeout_ms=5000
response_timeout_ms=10000
